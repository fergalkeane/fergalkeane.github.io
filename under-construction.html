<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fergal Keane: Website Under Construction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Space Grotesk';src:url('fonts/SpaceGrotesk-VariableFont_wght.ttf') format('truetype');font-weight:300 700;font-style:normal;font-display:swap;}
:root{--font-display:'Space Grotesk','Archivo',system-ui,sans-serif;--font-sans:'Archivo',system-ui,sans-serif;--font-mono:'JetBrains Mono',ui-monospace,monospace;--ink:#0d0d0d;--ink-soft:#1a1a1a;--muted:#8a8a8a;--line:#e6e6e6;--paper:#ffffff;--accent:#cf5a2c;}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;}
body{background:var(--paper);color:var(--ink);font-family:var(--font-sans);font-weight:300;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100%;}
a{color:var(--accent);text-decoration:none;border-bottom:1px solid rgba(207,90,44,.35);transition:border-color .18s ease,color .18s ease;}
a:hover{color:var(--ink);border-color:var(--ink);}
.lbl{font-family:var(--font-mono);font-size:11px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin:0;}
.uc-top{padding:34px clamp(24px,5vw,56px);border-bottom:1px solid var(--line);}
.uc-mark{font-family:var(--font-display);font-size:15px;font-weight:500;letter-spacing:-.01em;}
.uc-main{flex:1;display:flex;align-items:center;padding:clamp(56px,10vh,120px) clamp(24px,5vw,56px);}
.uc-inner{max-width:1180px;width:100%;display:grid;grid-template-columns:1fr minmax(340px,40%);gap:clamp(44px,6vw,88px);align-items:start;}
.uc-copy{max-width:600px;}
.form-card{background:#fafaf9;border:1px solid var(--line);padding:32px 30px;}
.field{margin-bottom:18px;}
.field label{display:block;margin-bottom:9px;}
.field input,.field textarea{width:100%;background:var(--paper);border:1px solid var(--line);border-radius:0;padding:13px 14px;font-family:var(--font-sans);font-size:14px;color:var(--ink);transition:border-color .15s ease;}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--ink);}
.field input::placeholder,.field textarea::placeholder{color:var(--muted);opacity:.6;}
.field textarea{min-height:118px;resize:vertical;}
.send-btn{width:100%;background:var(--ink);color:#fff;border:none;cursor:pointer;padding:17px;font-family:var(--font-mono);font-size:11px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;transition:background .18s ease;}
.send-btn:hover{background:var(--accent);}
.form-note{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin:16px 0 0;min-height:14px;color:var(--muted);}
.form-note.ok{color:var(--accent);}
.form-note.err{color:#c0392b;}
@media(max-width:860px){.uc-inner{grid-template-columns:1fr;gap:44px;}}
.uc-rule{display:flex;align-items:center;gap:16px;margin-bottom:34px;}
.uc-rule i{display:block;width:44px;height:1px;background:var(--accent);flex:none;}
h1{font-family:var(--font-display);font-weight:400;font-size:clamp(38px,6.4vw,74px);line-height:1.03;letter-spacing:-.028em;margin:0;text-wrap:balance;}
h1 em{font-style:normal;color:var(--accent);}
.uc-body{font-size:clamp(15px,1.6vw,18px);line-height:1.62;color:var(--ink-soft);max-width:46ch;margin:28px 0 0;text-wrap:pretty;}
.uc-contact{margin-top:44px;padding-top:26px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px;align-items:flex-start;}
.uc-mail{font-family:var(--font-display);font-size:clamp(19px,2.6vw,28px);font-weight:400;letter-spacing:-.015em;border-bottom-width:1px;}
.uc-li{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border:1px solid var(--line);border-radius:50%;color:var(--muted);margin-top:0;transition:background .2s,color .2s,border-color .2s;}
.uc-li:hover{background:var(--accent);border-color:var(--accent);color:#fff;}
.uc-li svg{width:16px;height:16px;}
.uc-foot{padding:26px clamp(24px,5vw,56px);border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;}
</style>
</head>
<body>
<header class="uc-top">
  <div class="uc-mark">Fergal Keane</div>
</header>
<main class="uc-main">
  <div class="uc-inner">
    <div class="uc-copy">
    <div class="uc-rule"><i></i><p class="lbl">Under Construction</p></div>
    <h1>The new site is being <em>built.</em></h1>
    <p class="uc-body">A refreshed portfolio of senior product and UX work is on the way. In the meantime, case studies and my full experience are available on request.</p>
    <div class="uc-contact">
      <a class="uc-li" href="https://www.linkedin.com/in/fergalkeane/" target="_blank" rel="noopener" aria-label="LinkedIn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM3 9h4v12H3zM9 9h3.8v1.7h.05c.53-.95 1.83-1.95 3.77-1.95 4.03 0 4.78 2.5 4.78 5.76V21h-4v-5.6c0-1.34-.03-3.06-1.9-3.06-1.9 0-2.2 1.45-2.2 2.96V21H9z"/></svg></a>
    </div>
    </div>
    <div class="form-card">
      <form id="contactForm" action="https://formspree.io/f/xwleleje" method="POST">
        <div class="field"><label class="lbl" for="cf-name">Name</label><input id="cf-name" type="text" name="name" placeholder="Your name" required></div>
        <div class="field"><label class="lbl" for="cf-email">Email</label><input id="cf-email" type="email" name="email" placeholder="you@company.com" required></div>
        <div class="field"><label class="lbl" for="cf-msg">Message</label><textarea id="cf-msg" name="message" placeholder="Your Message" required></textarea></div>
        <input type="hidden" name="_subject" value="New enquiry from fergalkeane.com">
        <input type="text" name="_gotcha" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px;" aria-hidden="true">
        <button class="send-btn" type="submit">Send Message</button>
        <p class="form-note" id="formNote" role="status" aria-live="polite"></p>
      </form>
    </div>
  </div>
</main>
<footer class="uc-foot">
  <p class="lbl">Fergal Keane © 2026</p>
</footer>
<script>
  const cf=document.getElementById('contactForm'),note=document.getElementById('formNote');
  cf.addEventListener('submit',async e=>{
    e.preventDefault();
    const btn=cf.querySelector('.send-btn');btn.disabled=true;btn.textContent='Sending…';
    note.className='form-note';note.textContent='';
    try{
      const r=await fetch(cf.action,{method:'POST',body:new FormData(cf),headers:{Accept:'application/json'}});
      if(r.ok){cf.reset();note.className='form-note ok';note.textContent='Thanks, message sent.';}
      else{note.className='form-note err';note.textContent='Something went wrong. Please email directly.';}
    }catch(_){note.className='form-note err';note.textContent='Network error. Please email directly.';}
    btn.disabled=false;btn.textContent='Send Message';
  });
</script>
</body>
</html>
